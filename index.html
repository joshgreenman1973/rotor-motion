<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Rotor Motion — helicopters over New York Harbor</title>
<meta name="description" content="Live helicopter traffic over New York City, drawn on the FAA New York Helicopter Route Chart from real-time ADS-B data." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link href="style.css" rel="stylesheet" />
</head>
<body>
<div id="map"></div>

<header id="title">
  <button id="title-close" aria-label="Hide" title="Hide">×</button>
  <h1><span class="accent">Rotor</span> Motion</h1>
  <p class="sub">Helicopters over New York Harbor, live — drawn on the FAA New York Helicopter Route
  Chart from real-time ADS-B. Tour flights, commuters, NYPD, medevac and news birds as they fly.</p>
</header>

<div id="tooltip"></div>
<div id="toast"></div>

<div id="panel">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="row">
    <span id="count">connecting…</span>
  </div>
  <div class="row">
    <span class="keylabel">Altitude</span>
    <div id="legend"></div>
  </div>
</div>

<div id="notice">Not for navigation · Chart © VFRMap.com / FAA · ADS-B via airplanes.live</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.0.36/dist.min.js"></script>
<script src="app.js"></script>
</body>
</html>
