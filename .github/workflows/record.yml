name: record-helicopters

# ONE long-lived recorder instead of a 15-minute cron.
#
# The live page reads helicopters from the Cloudflare relay in worker/, and the
# relay can't fetch ADS-B itself (adsb.fi refuses Cloudflare's network). So this
# job runs recorder/loop.mjs, which stays up about 5.5 hours, fetches adsb.fi
# every 10 seconds, posts the helicopters to the relay, appends a snapshot to
# the `data` branch every 15 minutes, and then starts its own successor through
# workflow_dispatch (dispatch events are not subject to cron delays). GitHub's
# cron started only about five of 96 runs a day from Oct. 1, 2026, so the
# hourly cron below is only a backstop: when a recorder is already live, the
# backstop run exits in seconds. Public repo, so Actions minutes are free.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      predecessor:
        description: "Run id of the recorder run that started this one (set automatically)"
        required: false
        default: ""
      once:
        description: "Fetch, post and archive once, then exit without starting a successor (for testing)"
        type: boolean
        default: false

permissions:
  contents: write   # archive commits to the data branch
  actions: write    # dispatch the successor
  id-token: write   # OIDC token the relay checks

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Single writer. Exit before doing anything if an older recorder run is
      # live. The run that dispatched this one is exempt; wait for it to finish.
      - name: Yield to a recorder that is already running
        id: guard
        if: ${{ github.event.inputs.once != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
          PRED: ${{ github.event.inputs.predecessor }}
        run: |
          others() {
            gh api "repos/$REPO/actions/workflows/record.yml/runs?status=in_progress&per_page=50" \
              --jq "[.workflow_runs[].id | select(. != $ME) | tostring] | join(\" \")"
          }
          if [ -n "$PRED" ]; then
            for i in $(seq 1 20); do
              case " $(others) " in *" $PRED "*) sleep 15 ;; *) break ;; esac
            done
          fi
          for id in $(others); do
            if [ "$id" != "${PRED:-0}" ] && [ "$id" -lt "$ME" ]; then
              echo "Recorder run $id is already live; this run yields."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with: { node-version: "22" }

      - name: Record
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ONCE: ${{ github.event.inputs.once }}
        run: |
          if [ "$ONCE" = "true" ]; then
            node recorder/loop.mjs --once
          else
            node recorder/loop.mjs
          fi
