name: record-helicopters
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay under load)
  workflow_dispatch: {}        # allow manual runs
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Snapshot helicopters
        run: node recorder/poll.mjs
      - name: Commit log
        run: |
          git config user.name "rotor-recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/log
          git diff --staged --quiet || git commit -m "log helicopters $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push
