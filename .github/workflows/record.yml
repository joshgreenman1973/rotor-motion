name: record-helicopters
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay under load)
  workflow_dispatch: {}        # allow manual runs
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      # main holds the recorder code; the `data` branch holds the archive it
      # writes. Keeping them apart means a snapshot never touches main, so it
      # never triggers a Pages rebuild of a site that does not read the archive.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Check out the archive
        run: |
          git fetch --depth=1 origin data
          git worktree add archive FETCH_HEAD

      # poll.mjs writes data/log relative to the working directory, so running
      # it inside the worktree lands the snapshot on the archive branch.
      - name: Snapshot helicopters
        working-directory: archive
        run: node ../recorder/poll.mjs

      - name: Commit the snapshot
        working-directory: archive
        run: |
          git config user.name "rotor-recorder"
          git config user.email "actions@users.noreply.github.com"
          git add data/log
          if git diff --staged --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "log helicopters $(date -u +%FT%TZ)"
          for attempt in 1 2 3; do
            git push origin HEAD:data && exit 0
            echo "push failed (attempt $attempt), rebasing on the latest archive"
            git fetch --depth=1 origin data && git rebase FETCH_HEAD || git rebase --abort
          done
          echo "could not push the snapshot after 3 attempts"
          exit 1
